name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.6.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.6.0
          cache: npm
      - run: npm ci
      - run: npm run audit:production
      - name: Generate production SBOM
        run: npm sbom --sbom-format cyclonedx --omit=dev > sbom.cdx.json
      - name: Upload production SBOM
        uses: actions/upload-artifact@v4
        with:
          name: production-sbom
          path: sbom.cdx.json
          if-no-files-found: error
